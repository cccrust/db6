[package]
name = "db6"
version = "4.1.0"
edition = "2021"
description = "Unified database with pluggable storage engines (Memory/BTree/LSM) (KV + SQL + FTS)"

[[bin]]
name = "db6"
path = "src/main.rs"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
zstd = "0.13"
bincode = "1.3"
memmap2 = "0.9"
fastrand = "2.0"
tokio = { version = "1.0", features = ["full"] }
bytes = "1.0"

[dev-dependencies]
tempfile = "3.14"